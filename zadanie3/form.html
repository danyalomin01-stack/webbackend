<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Анкета студента</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Анкета</h1>
        
        <form action="save.php" method="POST">
            <!-- 1. ФИО -->
            <div class="field">
                <label>ФИО:</label>
                <input type="text" name="fio" required>
            </div>
            
            <!-- 2. Телефон -->
            <div class="field">
                <label>Телефон:</label>
                <input type="tel" name="phone" required>
            </div>
            
            <!-- 3. Email -->
            <div class="field">
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>
            
            <!-- 4. Дата рождения -->
            <div class="field">
                <label>Дата рождения:</label>
                <input type="date" name="birthdate" required>
            </div>
            
            <!-- 5. Пол -->
            <div class="field">
                <label>Пол:</label>
                <div class="radio-group">
                    <input type="radio" name="gender" value="male" id="male">
                    <label for="male">Мужской</label>
                    <input type="radio" name="gender" value="female" id="female">
                    <label for="female">Женский</label>
                </div>
            </div>
            
            <!-- 6. Языки -->
            <div class="field">
                <label>Любимые языки программирования:</label>
                <select name="languages[]" multiple>
                    <option value="Pascal">Pascal</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="PHP">PHP</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="Haskell">Haskell</option>
                    <option value="Clojure">Clojure</option>
                    <option value="Prolog">Prolog</option>
                    <option value="Scala">Scala</option>
                    <option value="Go">Go</option>
                </select>
                <small>Зажмите Ctrl (Cmd) чтобы выбрать несколько</small>
            </div>
            
            <!-- 7. Биография -->
            <div class="field">
                <label>Биография:</label>
                <textarea name="bio" rows="4" placeholder="Немного о себе..."></textarea>
            </div>
            
            <!-- 8. Согласие -->
            <div class="field checkbox">
                <input type="checkbox" name="agree" value="1" id="agree" required>
                <label for="agree">Я ознакомлен(а) с контрактом</label>
            </div>
            
            <button type="submit">Сохранить</button>
        </form>
    </div>
</body>
</html>
